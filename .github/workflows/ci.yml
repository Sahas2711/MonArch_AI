name: MonArch / Vasooli CI Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    name: Unit Tests & Development Benchmark Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libmagic-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --tb=short

      - name: Run Benchmark Evaluation Gate (Dev Set)
        run: |
          python -m evaluation.runner --split dev --report dev_eval_report.md

      - name: Upload Evaluation Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-evaluation-report
          path: dev_eval_report.md
